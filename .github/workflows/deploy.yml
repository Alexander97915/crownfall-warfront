name: Deploy Crownfall to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.webp'
      - 'overrides/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment workflow and new art
        uses: actions/checkout@v4
      - name: Download base game package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern crownfall-site-v1.tar.gz --dir "$RUNNER_TEMP"
      - name: Extract base and apply painted art
        run: |
          mkdir -p "$RUNNER_TEMP/site/assets/skill-extra-sheets"
          tar -xzf "$RUNNER_TEMP/crownfall-site-v1.tar.gz" -C "$RUNNER_TEMP/site"
          cp lina-laguna-blade-0.webp faceless-chronosphere-0.webp "$RUNNER_TEMP/site/assets/skill-extra-sheets/"
          python overrides/painted_ultimates.py "$RUNNER_TEMP/site"
          mkdir -p "$RUNNER_TEMP/site/assets/skill-vfx-sheets"
          cp signatures-*.webp laguna-impact.webp chronosphere-field.webp "$RUNNER_TEMP/site/assets/skill-vfx-sheets/"
          cp overrides/skill-vfx.js "$RUNNER_TEMP/site/skill-vfx.js"
          cp overrides/game.js "$RUNNER_TEMP/site/game.js"
          test -f "$RUNNER_TEMP/site/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
