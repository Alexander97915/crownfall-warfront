name: Deploy Crownfall to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment workflow
        uses: actions/checkout@v4
      - name: Download latest game package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern crownfall-site-v1.tar.gz --dir "$RUNNER_TEMP"
      - name: Extract static site
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/crownfall-site-v1.tar.gz" -C "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
